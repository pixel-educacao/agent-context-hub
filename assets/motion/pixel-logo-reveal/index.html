<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Logo Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    --page: #E7E4DD;
    --stage: #F2F1ED;
    --ink: #15161F;
    --muted: #55545C;
    --line: rgba(21, 22, 31, .14);
    --track: rgba(21, 22, 31, .10);
    --orange: #FF5100;
    --on-orange: #05060F;
    --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 18px 50px rgba(40, 30, 20, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0A0C18;
      --stage: #05060F;
      --ink: #F2F1ED;
      --muted: rgba(242, 241, 237, .78);
      --line: rgba(242, 241, 237, .12);
      --track: rgba(242, 241, 237, .10);
      --shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 30px 80px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0A0C18;
    --stage: #05060F;
    --ink: #F2F1ED;
    --muted: rgba(242, 241, 237, .78);
    --line: rgba(242, 241, 237, .12);
    --track: rgba(242, 241, 237, .10);
    --shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 30px 80px rgba(0,0,0,.6);
  }

  body {
    background: var(--page);
    color: var(--ink);
    font: 600 15px/1.5 Manrope, "Helvetica Neue", Arial, sans-serif;
    padding-inline: 16px;
    padding-block: 28px 40px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 18px; }

  .eyebrow {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px;
    font: 500 11.5px/1.4 "JetBrains Mono", ui-monospace, Menlo, monospace;
    letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
  }

  .stage {
    position: relative;
    aspect-ratio: 16 / 9; max-width: 100%;
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .stage svg { display: block; width: 100%; height: 100%; }
  #bg { fill: var(--stage); }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; }
  button {
    font: 800 14px/1 Manrope, "Helvetica Neue", Arial, sans-serif;
    letter-spacing: -.01em;
    border-radius: 999px; cursor: pointer;
    padding: 12px 20px;
    border: 1px solid var(--line);
    background: transparent; color: var(--ink);
    display: inline-flex; align-items: center; gap: 9px;
  }
  button:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  #play { background: var(--orange); border-color: var(--orange); color: var(--on-orange); }
  #play:hover { filter: brightness(1.06); }
  #sound:hover { border-color: var(--muted); }
  #sound[aria-pressed="false"] { color: var(--muted); }
  .ico { width: 14px; height: 14px; flex: none; }
  .time {
    margin-left: auto;
    font: 500 13px/1 "JetBrains Mono", ui-monospace, Menlo, monospace;
    font-variant-numeric: tabular-nums; color: var(--muted);
  }

  .beats { position: relative; height: 34px; }
  .beats .rail { position: absolute; left: 0; right: 0; top: 6px; height: 3px; border-radius: 3px; background: var(--track); }
  .beats .fill { position: absolute; left: 0; top: 6px; height: 3px; border-radius: 3px; background: var(--orange); width: 100%; }
  .beat { position: absolute; top: 0; transform: translateX(-50%); display: grid; justify-items: center; gap: 5px; }
  .beat i { width: 1px; height: 15px; background: var(--muted); opacity: .6; }
  .beat b {
    font: 500 10.5px/1 "JetBrains Mono", ui-monospace, Menlo, monospace;
    letter-spacing: .08em; color: var(--muted); white-space: nowrap;
  }
  .note { color: var(--muted); max-width: 62ch; margin: 0; font-size: 14px; }

  @media (max-width: 560px) {
    .beat.sm b { display: none; }
    .time { margin-left: 0; }
  }

  /* modo export: palco em tela cheia, sem interface */
  .export body { padding: 0; background: var(--stage); }
  .export .wrap { max-width: none; gap: 0; }
  .export .stage { border: 0; border-radius: 0; box-shadow: none; width: 100vw; height: 100vh; aspect-ratio: auto; }
  .export .eyebrow, .export .controls, .export .beats, .export .note { display: none; }
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow"><span>Pixel · logo reveal</span><span>1920 × 1080 · 6 s</span></div>

  <div class="stage">
    <svg id="svg" viewBox="0 0 1920 1080" role="img" aria-label="Animação: uma bolinha laranja se multiplica até formar o símbolo da Pixel, e a palavra pixel aparece ao lado">
      <defs>
        <radialGradient id="glowGrad">
          <stop offset="0" stop-color="#FF5100" stop-opacity=".55"/>
          <stop offset=".45" stop-color="#FF5100" stop-opacity=".16"/>
          <stop offset="1" stop-color="#FF5100" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect id="bg" width="1920" height="1080"/>
      <g id="symbol">
        <circle id="glow" cx="250" cy="250" r="520" fill="url(#glowGrad)" opacity="0"/>
        <g id="rings"></g>
        <g id="dots"></g>
      </g>
      <g id="word" transform="translate(421 402.5) scale(0.55)"></g>
    </svg>
  </div>

  <div class="controls">
    <button id="play" type="button">
      <svg class="ico" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9.5-5.5z" fill="currentColor"/></svg>
      <span id="playLabel">Tocar</span>
    </button>
    <button id="sound" type="button" aria-pressed="true">
      <svg class="ico" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 5h2.5l3.5-3v10l-3.5-3h-2.5z" fill="currentColor"/><path id="waves" d="M9.6 4.4a3.6 3.6 0 0 1 0 5.2M11.3 2.8a6 6 0 0 1 0 8.4" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
      <span id="soundLabel">Som ligado</span>
    </button>
    <span class="time" id="time">6,00 / 6,00 s</span>
  </div>

  <div class="beats" id="beats" aria-hidden="true">
    <div class="rail"></div>
    <div class="fill" id="fill"></div>
  </div>

  <p class="note">Uma bolinha nasce no centro e se divide em quatro gerações, 1, 4, 4, 4 e 8, até fechar as 21 do símbolo. O símbolo desliza para a esquerda, a palavra entra letra por letra e o pingo do i cai por último. Os sons são gerados ao vivo no navegador.</p>
</div>

    ["p", 3.55], ["iStem", 3.65], ["x", 3.75], ["e", 3.85], ["l", 3.95],
  ];
  const DOT_DROP = 4.12, DOT_LAND = 4.45;
  const letters = {};
  for (const name of ["p", "iStem", "iDot", "x", "e", "l"]) {
    const g = document.createElementNS(NS, "g");
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", WORD[name]);
    p.setAttribute("fill", "#FF5100");
    g.appendChild(p);
    $("word").appendChild(g);
    letters[name] = { g, p };
  }
  for (const name in letters) {
    const b = letters[name].p.getBBox();
    letters[name].ox = b.x + b.width / 2;
    letters[name].oy = b.y + b.height;
  }

  // ---------- layout ----------
  const S = 0.55;                                       // escala do lockup final
  const FINAL = { x: 421 + 250 * S, y: 402.5 + 250 * S, s: S };
  const INTRO = { x: 960, y: 540, s: S * 1.35 };
  const SLIDE_T = 3.2, SLIDE_D = 0.62;
  const SETTLE_T = 2.95;

  function centerScale(t) {
    let s = 0;
    const a = prog(t, GEN_T[0], 0.42);
    s = CENTER_SCALE[0] * backOut(a, 2.6);
    for (let g = 1; g <= 4; g++) {
      const k = prog(t, GEN_T[g], 0.3);
      s += (CENTER_SCALE[g] - CENTER_SCALE[g - 1]) * backOut(k, 2.2);
    }
    // antes da primeira divisão: respira, como se estivesse carregando
    const charge = prog(t, GEN_T[0] + 0.35, GEN_T[1] - GEN_T[0] - 0.35);
    if (charge > 0 && charge < 1) s *= 1 + 0.10 * Math.sin(charge * Math.PI * 3.5) * charge;
    return s;
  }

  function render(t) {
    t = clamp(t, 0, DURATION);

    // símbolo: posição/escala do grupo
    const k = cubicInOut(prog(t, SLIDE_T, SLIDE_D));
    const settle = 1 + 0.045 * bump(t, SETTLE_T, 0.31);
    const gx = lerp(INTRO.x, FINAL.x, k), gy = lerp(INTRO.y, FINAL.y, k);
    const gs = lerp(INTRO.s, FINAL.s, k) * settle;
    $("symbol").setAttribute("transform", `translate(${gx} ${gy}) scale(${gs}) translate(-250 -250)`);

    // flash de virada: sobe em .16s, cai em .75s
    const up = prog(t, SETTLE_T, 0.16), down = prog(t, SETTLE_T + 0.16, 0.75);
    $("glow").setAttribute("opacity", (up * (1 - quadOut(down))).toFixed(3));

    // bolinhas
    for (const dot of dots) {
      let x = dot.cx, y = dot.cy, s;
      if (dot.gen === 0) {
        s = centerScale(t);
      } else {
        const m = prog(t, dot.born, TRAVEL);
        if (t < dot.born) { dot.el.setAttribute("visibility", "hidden"); continue; }
        const e = backOut(m, 1.9);
        x = lerp(dot.parent.cx, dot.cx, e);
        y = lerp(dot.parent.cy, dot.cy, e);
        s = lerp(0.3, 1, backOut(m, 2.4));
      }
      // cada mãe dá um "soluço" quando uma filha sai dela
      let kick = 0;
      for (const kb of dot.kids) kick = Math.max(kick, bump(t, kb, 0.18));
      s *= 1 + 0.16 * kick;
      dot.el.setAttribute("visibility", s > 0.001 ? "visible" : "hidden");
      dot.el.setAttribute("transform", `translate(${x} ${y}) scale(${Math.max(s, 0)}) translate(${-dot.cx} ${-dot.cy})`);
    }

    // anéis de onda a cada divisão
    for (const r of rings) {
      const m = prog(t, r.t - 0.02, 0.55);
      if (m <= 0 || m >= 1) { r.el.setAttribute("visibility", "hidden"); continue; }
      r.el.setAttribute("visibility", "visible");
      r.el.setAttribute("r", (20 + r.reach * quadOut(m)).toFixed(1));
      r.el.setAttribute("stroke-width", (7 * (1 - m) + 0.5).toFixed(2));
      r.el.setAttribute("opacity", (0.5 * (1 - m)).toFixed(3));
    }

    // letras
    for (const [name, start] of LETTERS) {
      const L = letters[name], m = prog(t, start, 0.45);
      const e = backOut(m, 2.2);
      const dy = (1 - e) * 70, sc = lerp(0.55, 1, e);
      L.g.setAttribute("opacity", clamp(m * 3).toFixed(3));
      L.g.setAttribute("transform", `translate(${L.ox} ${L.oy + dy}) scale(${sc}) translate(${-L.ox} ${-L.oy})`);
    }
    // pingo do i: cai do alto, quica e assenta
    {
      const L = letters.iDot;
      let dy;
      if (t < DOT_LAND) { const f = prog(t, DOT_DROP, DOT_LAND - DOT_DROP); dy = -520 * (1 - f * f); }
      else { const b = prog(t, DOT_LAND, 0.28); dy = -60 * Math.sin(Math.PI * b) * (b < 1 ? 1 : 0); }
      const land = bump(t, DOT_LAND, 0.14) + 0.5 * bump(t, DOT_LAND + 0.28, 0.1);
      const sx = 1 + 0.28 * land, sy = 1 - 0.24 * land;
      L.g.setAttribute("opacity", t >= DOT_DROP ? 1 : 0);
      L.g.setAttribute("transform", `translate(${L.ox} ${L.oy + dy}) scale(${sx} ${sy}) translate(${-L.ox} ${-L.oy})`);
    }

    $("time").textContent = `${t.toFixed(2).replace(".", ",")} / 6,00 s`;
    $("fill").style.width = (t / DURATION * 100) + "%";
  }

  // ---------- trilha de batidas ----------
  const BEATS = [
    [GEN_T[0], "1", 1], [GEN_T[1], "×4", 0], [GEN_T[2], "×4", 0], [GEN_T[3], "×4", 0], [GEN_T[4], "×8", 1],
    [SLIDE_T, "desliza", 1], [LETTERS[0][1], "p", 0], [DOT_LAND, "pingo", 1],
  ];
  for (const [bt, label, big] of BEATS) {
    const el = document.createElement("div");
    el.className = "beat" + (big ? "" : " sm");
    el.style.left = (bt / DURATION * 100) + "%";
    el.innerHTML = `<i></i><b>${label}</b>`;
    $("beats").appendChild(el);
  }

  // ---------- som (Web Audio, tudo sintetizado) ----------
  function makeNoise(ctx, seconds) {
    const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * seconds), ctx.sampleRate);
    const ch = buf.getChannelData(0);
    let seed = 7;
    for (let i = 0; i < ch.length; i++) { seed = (seed * 16807) % 2147483647; ch[i] = seed / 1073741823.5 - 1; }
    return buf;
  }

  function buildBus(ctx, out) {
    const master = ctx.createGain(); master.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
    // eco curto para dar corpo
    const send = ctx.createGain(); send.gain.value = 0.22;
    const delay = ctx.createDelay(1); delay.delayTime.value = 0.13;
    const fb = ctx.createGain(); fb.gain.value = 0.3;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3200;
    master.connect(comp); master.connect(send);
    send.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(comp);
    comp.connect(out);
    return master;
  }

  function schedule(ctx, bus, t0) {
    const env = (g, at, peak, attack, decay) => {
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(peak, at + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, at + attack + decay);
    };
    // bolha: seno que sobe rápido
    const pop = (at, f, peak = 0.35, len = 0.14, pan = 0) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), p = ctx.createStereoPanner();
      o.type = "sine";
      o.frequency.setValueAtTime(f * 0.55, at);
      o.frequency.exponentialRampToValueAtTime(f * 1.25, at + 0.045);
      o.frequency.exponentialRampToValueAtTime(f, at + len);
      env(g, at, peak, 0.004, len);
      p.pan.value = pan;
      o.connect(g); g.connect(p); p.connect(bus);
      o.start(at); o.stop(at + len + 0.05);
    };
    // "tok" de marimba para as letras
    const tok = (at, f, peak = 0.3) => {
      for (const [mul, amp, dec] of [[1, 1, 0.28], [3.98, 0.35, 0.07]]) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = f * mul;
        env(g, at, peak * amp, 0.003, dec);
        o.connect(g); g.connect(bus); o.start(at); o.stop(at + dec + 0.05);
      }
    };
    const thump = (at, peak = 0.5) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(180, at);
      o.frequency.exponentialRampToValueAtTime(55, at + 0.16);
      env(g, at, peak, 0.004, 0.2);
      o.connect(g); g.connect(bus); o.start(at); o.stop(at + 0.3);
    };
    const whoosh = (at, len) => {
      const src = ctx.createBufferSource(); src.buffer = makeNoise(ctx, len + 0.1);
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.4;
      bp.frequency.setValueAtTime(350, at);
      bp.frequency.exponentialRampToValueAtTime(2600, at + len * 0.55);
      bp.frequency.exponentialRampToValueAtTime(700, at + len);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.28, at + len * 0.5);
      g.gain.exponentialRampToValueAtTime(0.0001, at + len);
      const p = ctx.createStereoPanner();
      p.pan.setValueAtTime(0.5, at); p.pan.linearRampToValueAtTime(-0.5, at + len);
      src.connect(bp); bp.connect(g); g.connect(p); p.connect(bus);
      src.start(at); src.stop(at + len + 0.05);
    };
    const chime = (at) => {
      for (const [f, amp, dec] of [[1046.5, 0.16, 1.5], [1568, 0.11, 1.3], [2637, 0.06, 1.1], [523.25, 0.1, 1.4]]) {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = f;
        env(g, at, amp, 0.01, dec);
        o.connect(g); g.connect(bus); o.start(at); o.stop(at + dec + 0.1);
      }
    };
    const glint = (at) => {
      const src = ctx.createBufferSource(); src.buffer = makeNoise(ctx, 0.5);
      const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 6000;
      const g = ctx.createGain(); env(g, at, 0.12, 0.01, 0.35);
      src.connect(hp); hp.connect(g); g.connect(bus); src.start(at); src.stop(at + 0.45);
    };

    // 1ª bolinha nasce
    pop(t0 + GEN_T[0], 330, 0.45, 0.22);
    // cada filha tem seu estalo; a nota sobe a cada geração (pentatônica)
    const NOTES = [null, [523.25, 587.33], [659.25, 783.99], [783.99, 880], [1046.5, 1174.66, 1318.5, 1174.66]];
    for (const dot of dots) {
      if (!dot.gen) continue;
      const seq = NOTES[dot.gen];
      const pan = clamp((dot.cx - 250) / 260, -0.8, 0.8);
      pop(t0 + dot.born, seq[dot.order % seq.length], dot.gen === 4 ? 0.24 : 0.3, 0.12, pan);
    }
    glint(t0 + SETTLE_T);
    whoosh(t0 + SLIDE_T - 0.08, SLIDE_D + 0.2);
    const LETTER_NOTES = [392, 440, 523.25, 587.33, 659.25];
    LETTERS.forEach(([, st], k) => tok(t0 + st + 0.06, LETTER_NOTES[k]));
    // pingo do i: assobio de queda, pouso e quique
    {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(1500, t0 + DOT_DROP);
      o.frequency.exponentialRampToValueAtTime(500, t0 + DOT_LAND);
      g.gain.setValueAtTime(0.0001, t0 + DOT_DROP);
      g.gain.exponentialRampToValueAtTime(0.06, t0 + DOT_DROP + 0.12);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + DOT_LAND);
      o.connect(g); g.connect(bus); o.start(t0 + DOT_DROP); o.stop(t0 + DOT_LAND + 0.02);
    }
    thump(t0 + DOT_LAND, 0.55);
    pop(t0 + DOT_LAND, 784, 0.3, 0.12);
    pop(t0 + DOT_LAND + 0.28, 1046.5, 0.16, 0.1);
    chime(t0 + DOT_LAND + 0.12);
  }

  // ---------- reprodução ----------
  let ctx = null, bus = null, run = null, raf = 0, soundOn = true;
  let startPerf = 0, startAudio = 0, playing = false;

  function now() {
    if (run && run.audio) return ctx.currentTime - startAudio;
    return (performance.now() - startPerf) / 1000;
  }
  function tick() {
    const t = now();
    render(t);
    if (t < DURATION) raf = requestAnimationFrame(tick);
    else { playing = false; $("playLabel").textContent = "Tocar de novo"; }
  }
  function stopRun() {
    cancelAnimationFrame(raf);
    if (run && run.gain) { try { run.gain.disconnect(); } catch (e) {} }
    run = null;
  }
  async function play() {
    stopRun();
    let audio = false, gain = null;
    if (soundOn) {
      try {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state !== "running") await ctx.resume();
        if (!bus) bus = buildBus(ctx, ctx.destination);
        gain = ctx.createGain(); gain.connect(bus);
        startAudio = ctx.currentTime + 0.06;
        schedule(ctx, gain, startAudio);
        audio = true;
      } catch (e) { audio = false; }
    }
    startPerf = performance.now();
    run = { audio, gain };
    playing = true;
    $("playLabel").textContent = "Tocar de novo";
    tick();
  }

  $("play").addEventListener("click", play);
  $("sound").addEventListener("click", () => {
    soundOn = !soundOn;
    $("sound").setAttribute("aria-pressed", soundOn);
    $("soundLabel").textContent = soundOn ? "Som ligado" : "Sem som";
    $("waves").style.display = soundOn ? "" : "none";
    if (!soundOn && run && run.gain) { try { run.gain.disconnect(); } catch (e) {} }
  });

  // estado inicial: o logo pronto, esperando o play
  render(DURATION);

  // ---------- gancho para exportar vídeo (usado pelo render.mjs) ----------
  window.__pixel = {
    DURATION, render,
    async wav(sampleRate = 48000) {
      const len = Math.ceil(sampleRate * DURATION);
      const off = new OfflineAudioContext(2, len, sampleRate);
      schedule(off, buildBus(off, off.destination), 0);
      const buf = await off.startRendering();
      const L = buf.getChannelData(0), R = buf.getChannelData(1);
      const data = new DataView(new ArrayBuffer(44 + len * 4));
      const str = (o, s) => { for (let i = 0; i < s.length; i++) data.setUint8(o + i, s.charCodeAt(i)); };
      str(0, "RIFF"); data.setUint32(4, 36 + len * 4, true); str(8, "WAVE"); str(12, "fmt ");
      data.setUint32(16, 16, true); data.setUint16(20, 1, true); data.setUint16(22, 2, true);
      data.setUint32(24, sampleRate, true); data.setUint32(28, sampleRate * 4, true);
      data.setUint16(32, 4, true); data.setUint16(34, 16, true); str(36, "data"); data.setUint32(40, len * 4, true);
      for (let i = 0, o = 44; i < len; i++, o += 4) {
        data.setInt16(o, clamp(L[i], -1, 1) * 32767, true);
        data.setInt16(o + 2, clamp(R[i], -1, 1) * 32767, true);
      }
      const bytes = new Uint8Array(data.buffer);
      let bin = "";
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(bin);
    },
  };
})();
</script>

</body>
