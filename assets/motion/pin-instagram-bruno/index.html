        </g>
        <text id="follow" y="902" fill="#F5F5F5" font-family="Manrope Pin, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="28">Siga no Instagram</text>

  </div>
  <p class="note">Loop de 8 s para o pin. O anel de story gira uma volta por loop; o resto fica parado.</p>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const T = 8, TAU = Math.PI * 2;
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  if (params.has("export")) document.documentElement.classList.add("export");
  const URL_IG = params.get("qr") || "https://www.instagram.com/obrunookamoto";

  // selo de verificado: círculo com bordas recortadas
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * TAU, c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", (Math.cos(a) * 9.2).toFixed(2));
    c.setAttribute("cy", (Math.sin(a) * 9.2).toFixed(2));
    c.setAttribute("r", "3.6");
    $("scallops").appendChild(c);
  }

  function layout() {
    // @handle + selo centralizados juntos
    const w = $("handle").getComputedTextLength(), gap = 14, bw = 26;
    const x0 = 540 - (w + gap + bw) / 2;
    $("handle").setAttribute("x", x0.toFixed(1));
    $("verified").setAttribute("transform", `translate(${(x0 + w + gap + bw / 2).toFixed(1)} 425) scale(1.25)`);
    // ícone + "Siga no Instagram" centralizados juntos
    const fw = $("follow").getComputedTextLength(), gs = 40, fg = 14;
    const f0 = 540 - (gs + fg + fw) / 2;
    $("glyph").setAttribute("transform", `translate(${f0.toFixed(1)} 872) scale(${gs / 24})`);
    $("follow").setAttribute("x", (f0 + gs + fg).toFixed(1));
  }

  function drawQR(text) {
    const qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount(), quiet = 3, box = 320;
    const m = box / (n + quiet * 2), ox = 380 + quiet * m, oy = 514 + quiet * m;
    let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (qr.isDark(r, c)) d += `M${(ox + c * m).toFixed(2)} ${(oy + r * m).toFixed(2)}h${m.toFixed(3)}v${m.toFixed(3)}h${(-m).toFixed(3)}z`;
    }
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("fill", "url(#qrInk)");
    p.setAttribute("shape-rendering", "crispEdges");
    $("qr").replaceChildren(p);
  }

  function render(t) {
    t = ((t % T) + T) % T;
    $("ring").setAttribute("transform", `rotate(${(360 * t / T).toFixed(3)} 540 285)`);
    $("glow").setAttribute("opacity", (0.75 + 0.25 * Math.sin(TAU * t / 4)).toFixed(3));
  }

  drawQR(URL_IG);
  let ready = false;
  document.fonts.load('800 46px "Manrope Pin"').then(() => document.fonts.ready).then(() => { layout(); ready = true; });
  render(0);

  if (!params.has("export") && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const t0 = performance.now();
    const frame = () => { render((performance.now() - t0) / 1000); requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
  }
  window.__pin = { T, render, ready: () => ready && $("qr").childNodes.length > 0 };
})();
</script>
