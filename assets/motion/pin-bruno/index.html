<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pin do Bruno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --page: #E7E4DD;
    --ink: #15161F;
    --muted: #55545C;
    --line: rgba(21, 22, 31, .14);
    --field: #F4F3EF;
    --orange: #FF5100;
    --on-orange: #05060F;
    --shadow: 0 30px 70px rgba(40, 30, 20, .22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0A0C18;
      --ink: #F2F1ED;
      --muted: rgba(242, 241, 237, .78);
      --line: rgba(242, 241, 237, .14);
      --field: #11142A;
      --shadow: 0 30px 80px rgba(0, 0, 0, .7), 0 0 0 1px rgba(242, 241, 237, .08);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0A0C18;
    --ink: #F2F1ED;
    --muted: rgba(242, 241, 237, .78);
    --line: rgba(242, 241, 237, .14);
    --field: #11142A;
    --shadow: 0 30px 80px rgba(0, 0, 0, .7), 0 0 0 1px rgba(242, 241, 237, .08);
  }

  body {
    background: var(--page);
    color: var(--ink);
    font: 600 15px/1.5 Manrope, "Helvetica Neue", Arial, sans-serif;
    padding-inline: 16px;
    padding-block: 28px 44px;
  }
  .wrap { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 36px; align-items: center; }
  @media (max-width: 780px) { .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; } }

  .stage {
    width: 100%; max-width: 520px; aspect-ratio: 1; margin: 0 auto;
    background: #05060F;
    border-radius: 50%;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: border-radius .35s ease;
  }
  .stage.square { border-radius: 18px; }
  .stage svg { display: block; width: 100%; height: 100%; }

  .side { display: grid; gap: 20px; }
  .eyebrow {
    font: 500 11.5px/1.4 "JetBrains Mono", ui-monospace, Menlo, monospace;
    letter-spacing: .2em; text-transform: uppercase; color: var(--muted);
  }
  h1 { margin: 0; font: 800 34px/1.05 Manrope, "Helvetica Neue", Arial, sans-serif; letter-spacing: -.035em; text-wrap: balance; }
  .note { color: var(--muted); margin: 0; max-width: 52ch; font-size: 14.5px; }

  .field { display: grid; gap: 7px; }
  label { font: 500 11px/1 "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type="url"] {
    flex: 1 1 220px; min-width: 0;
    font: 500 14px/1 "JetBrains Mono", ui-monospace, Menlo, monospace;
    color: var(--ink); background: var(--field);
    border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px;
  }
  input[type="url"]:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .err { color: var(--ink); font-size: 13px; margin: 0; }

  button {
    font: 800 14px/1 Manrope, "Helvetica Neue", Arial, sans-serif;
    border-radius: 999px; cursor: pointer; padding: 12px 18px;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    display: inline-flex; align-items: center; gap: 8px;
  }
  button:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  button.primary { background: var(--orange); border-color: var(--orange); color: var(--on-orange); }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .time { margin-left: auto; font: 500 13px/1 "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; color: var(--muted); }

  .specs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .specs div { background: var(--page); padding: 10px 12px; display: grid; gap: 3px; }
  .specs b { font: 800 16px/1.1 Manrope, "Helvetica Neue", Arial, sans-serif; font-variant-numeric: tabular-nums; }
  .specs span { font: 500 10.5px/1.2 "JetBrains Mono", ui-monospace, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .stage { transition: none; } }

  /* modo export: só o quadrado, sem interface */
  .export body { padding: 0; background: #05060F; }
  .export .wrap { display: block; max-width: none; }
  .export .stage { width: 100vw; height: 100vh; max-width: none; border-radius: 0; box-shadow: none; }
  .export .side { display: none; }
</style>
</head>
<body>

<div class="wrap">
  <div class="stage" id="stage">
    <svg id="svg" viewBox="0 0 1080 1080" role="img" aria-label="Pin: logo Pixel AI Hub no topo, QR code no centro e um robozinho trabalhando embaixo">
      <defs>
        <radialGradient id="bgGlow" cx="540" cy="540" r="560" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#FE5000" stop-opacity=".20"/>
          <stop offset=".55" stop-color="#FE5000" stop-opacity=".05"/>
          <stop offset="1" stop-color="#FE5000" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="bgBlue" cx="300" cy="900" r="520" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#2D3BAB" stop-opacity=".22"/>
          <stop offset="1" stop-color="#2D3BAB" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="1" stop-color="#D6D3CB"/>
        </linearGradient>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="14"/>
        </filter>
      </defs>

      <rect width="1080" height="1080" fill="#05060F"/>
      <rect width="1080" height="1080" fill="url(#bgBlue)"/>
      <rect width="1080" height="1080" fill="url(#bgGlow)"/>
      <circle cx="540" cy="540" r="506" fill="none" stroke="#2D3BAB" stroke-opacity=".45" stroke-width="2"/>

            <rect x="160" y="76" width="16" height="32" rx="8" fill="#FF5100"/>
            <rect x="34" y="38" width="132" height="106" rx="38" fill="url(#shell)"/>
            <rect x="48" y="55" width="104" height="68" rx="27" fill="#0A0D1F" stroke="#1B2250" stroke-width="2"/>
            <g id="eyes" filter="url(#glow)">
              <rect id="eyeL" x="74" y="77" width="17" height="25" rx="8.5" fill="#FFB08F"/>
              <rect id="eyeR" x="109" y="77" width="17" height="25" rx="8.5" fill="#FFB08F"/>
              <g id="happy" opacity="0" fill="none" stroke="#FFB08F" stroke-width="6" stroke-linecap="round">
                <path d="M72 94 Q82.5 80 93 94"/>
                <path d="M107 94 Q117.5 80 128 94"/>
              </g>
            </g>
            <ellipse cx="56" cy="132" rx="9" ry="5" fill="#FF5100" opacity=".35"/>
            <ellipse cx="144" cy="132" rx="9" ry="5" fill="#FF5100" opacity=".35"/>
          </g>
          <rect x="88" y="142" width="24" height="12" rx="3" fill="#B9B6AE"/>
          <rect x="58" y="150" width="84" height="64" rx="24" fill="url(#shell)"/>
          <circle id="chest" cx="100" cy="176" r="7" fill="#FF5100"/>
          <!-- braços -->
          <path id="armL" fill="none" stroke="#E4E1DA" stroke-width="13" stroke-linecap="round"/>
          <path id="armR" fill="none" stroke="#E4E1DA" stroke-width="13" stroke-linecap="round"/>
          <!-- teclado -->
          <rect x="38" y="212" width="124" height="26" rx="9" fill="#141A3A" stroke="#2D3BAB" stroke-width="2"/>
          <g id="keys"></g>
          <circle id="handL" r="10" fill="#F2F1ED" stroke="#C9C6BF" stroke-width="2"/>
          <circle id="handR" r="10" fill="#F2F1ED" stroke="#C9C6BF" stroke-width="2"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="side">
    <div class="eyebrow">Pixel AI Hub · pin de palestra</div>
    <h1>Pin do Bruno</h1>
    <p class="note">O logo fica no topo, o QR no centro e o robô embaixo. Só o robô se mexe: digita no painel, olha para o QR, olha para o logo lá em cima, sorri e volta ao trabalho. O loop fecha sem emenda.</p>

    <div class="field">
      <label for="qrUrl">Link do QR</label>
      <div class="row">
        <input id="qrUrl" type="url" value="https://aihub.pixeleducacao.com.br" spellcheck="false" autocomplete="off">
        <button id="apply" type="button">Trocar QR</button>
      </div>
      <p class="err" id="qrErr" hidden></p>
    </div>

    <div class="controls">
      <button id="pause" type="button" class="primary">Pausar</button>
      <button id="shape" type="button" aria-pressed="false">Ver quadrado</button>
      <span class="time" id="time">0,00 / 8,00 s</span>
    </div>

    <div class="specs">
      <div><b>1080²</b><span>quadrado</span></div>
      <div><b>8 s</b><span>loop</span></div>
      <div><b>30 fps</b><span>sem áudio</span></div>
    </div>
  </div>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const T = 8;
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  if (params.has("export")) document.documentElement.classList.add("export");

  // ---------- util ----------
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = (k) => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const TAU = Math.PI * 2;
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };

  // ---------- QR (estático) ----------
  function drawQR(text) {
    const g = $("qr");
    g.replaceChildren();
    const qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount();
    const quiet = 3, box = 360, pad = 0;
    const m = (box - pad * 2) / (n + quiet * 2);
    const ox = 360 + pad + quiet * m, oy = 360 + pad + quiet * m;
    let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (qr.isDark(r, c)) d += `M${(ox + c * m).toFixed(2)} ${(oy + r * m).toFixed(2)}h${m.toFixed(3)}v${m.toFixed(3)}h${(-m).toFixed(3)}z`;
    }
    el("path", { d, fill: "#05060F", "shape-rendering": "crispEdges" }, g);
    return n;
  }

  // ---------- teclado ----------
  const keys = [];
  for (let r = 0; r < 2; r++) for (let c = 0; c < 8; c++) {
    keys.push(el("rect", { x: 47 + c * 13.5, y: 218 + r * 8.5, width: 9.5, height: 5.5, rx: 1.5, fill: "#2D3BAB" }, $("keys")));
  }

  // ---------- linhas de código no painel ----------
  const WIDTHS = [60, 38, 70, 46, 30, 56];
  const ROW_H = 13, ROWS = 5;
  const rows = [];
  for (let i = 0; i < ROWS + 1; i++) rows.push(el("rect", { x: 10, height: 6.5, rx: 3.25, fill: "#FFA38D" }, $("codeLines")));
  const cursor = el("rect", { width: 5, height: 9, rx: 1, fill: "#FF5100" }, $("codeLines"));

  // ---------- roteiro (segundos dentro do loop de 8 s) ----------
  // olhar: painel (esquerda) → QR (cima/direita) → logo (direita) → painel
  const GAZE = {
    work: { x: -9, y: 0,   tilt: -6, lift: 0 },
    qr:   { x: 2,  y: -8,  tilt: 2,  lift: -3 },
    logo: { x: -1, y: -10, tilt: -2, lift: -7 },
  };
  const KEYS = [[0, "work"], [2.3, "work"], [2.7, "qr"], [3.9, "qr"], [4.25, "logo"], [5.3, "logo"], [5.7, "work"], [8, "work"]];
  const TYPE_WINDOWS = [[0, 2.35], [5.75, 8]];
  const BLINKS = [1.3, 3.3, 6.8];
  const HAPPY = [4.45, 5.1];

  function gazeAt(t) {
    for (let i = 0; i < KEYS.length - 1; i++) {
      const [t0, a] = KEYS[i], [t1, b] = KEYS[i + 1];
      if (t >= t0 && t <= t1) {
        const k = ease(t1 > t0 ? (t - t0) / (t1 - t0) : 0);
        const A = GAZE[a], B = GAZE[b];
        return { x: lerp(A.x, B.x, k), y: lerp(A.y, B.y, k), tilt: lerp(A.tilt, B.tilt, k), lift: lerp(A.lift, B.lift, k) };
      }
    }
    return GAZE.work;
  }
  // 0..1: quanto está digitando (com rampa curta nas bordas)
  function typing(t) {
    let v = 0;
    for (const [a, b] of TYPE_WINDOWS) {
      const inA = a === 0 ? 1 : clamp((t - a) / 0.12);
      const outB = b === T ? 1 : clamp((b - t) / 0.12);
      if (t >= a && t <= b) v = Math.max(v, Math.min(inA, outB));
    }
    return v;
  }
  // tempo acumulado digitando, para as linhas avançarem só enquanto digita
  const TYPE_TOTAL = TYPE_WINDOWS.reduce((s, [a, b]) => s + b - a, 0);
  function typedTime(t) {
    let u = 0;
    for (const [a, b] of TYPE_WINDOWS) u += clamp(t, a, b) - a;
    return u;
  }

  function render(t) {
    t = ((t % T) + T) % T;
    const g = gazeAt(t);
    const ty = typing(t);

    // corpo respira (período 2 s) e cabeça acompanha a digitação
    const bob = 3 * Math.sin(TAU * t / 2);
    $("bot").setAttribute("transform", `translate(96 ${bob.toFixed(2)})`);
    const nod = ty * 1.6 * Math.sin(TAU * 3 * t);
    $("head").setAttribute("transform", `translate(0 ${(g.lift + nod).toFixed(2)}) rotate(${g.tilt.toFixed(2)} 100 120)`);

    // olhos: direção + piscada + sorriso
    let blink = 0;
    for (const b of BLINKS) { const k = (t - b) / 0.16; if (k > 0 && k < 1) blink = Math.sin(Math.PI * k); }
    const hIn = clamp((t - HAPPY[0]) / 0.1), hOut = clamp((HAPPY[1] - t) / 0.1);
    const happy = t > HAPPY[0] && t < HAPPY[1] ? Math.min(hIn, hOut) : 0;
    const sy = Math.max(0.08, 1 - blink) * (1 - happy);
    for (const id of ["eyeL", "eyeR"]) {
      const cx = id === "eyeL" ? 82.5 : 117.5;
      $(id).setAttribute("transform", `translate(${g.x.toFixed(2)} ${g.y.toFixed(2)}) translate(${cx} 89.5) scale(1 ${sy.toFixed(3)}) translate(${-cx} -89.5)`);
    }
    $("happy").setAttribute("opacity", happy.toFixed(3));
    $("happy").setAttribute("transform", `translate(${g.x.toFixed(2)} ${g.y.toFixed(2)})`);

    // antena e peito pulsam juntos (período 1 s)
    const pulse = 0.5 + 0.5 * Math.sin(TAU * t);
    $("ledGlow").setAttribute("opacity", (0.25 + 0.55 * pulse).toFixed(3));
    $("led").setAttribute("fill-opacity", (0.7 + 0.3 * pulse).toFixed(3));
    $("chest").setAttribute("fill-opacity", (0.55 + 0.45 * pulse).toFixed(3));

    // mãos batendo no teclado, alternadas (6 toques/s cada)
    const pL = Math.max(0, Math.sin(TAU * 6 * t)), pR = Math.max(0, Math.sin(TAU * 6 * t + Math.PI));
    const hlx = 72, hrx = 128, hy = 214;
    const lY = hy - 9 * ty * pL - 4 * (1 - ty), rY = hy - 9 * ty * pR - 4 * (1 - ty);
    const lX = hlx + 5 * ty * Math.sin(TAU * 1.5 * t), rX = hrx - 5 * ty * Math.sin(TAU * 1.5 * t + 1);
    $("handL").setAttribute("cx", lX.toFixed(2)); $("handL").setAttribute("cy", lY.toFixed(2));
    $("handR").setAttribute("cx", rX.toFixed(2)); $("handR").setAttribute("cy", rY.toFixed(2));
    $("armL").setAttribute("d", `M62 168 Q46 196 ${lX.toFixed(2)} ${lY.toFixed(2)}`);
    $("armR").setAttribute("d", `M138 168 Q154 196 ${rX.toFixed(2)} ${rY.toFixed(2)}`);
    const pressL = ty * pL > 0.85, pressR = ty * pR > 0.85;
    keys.forEach((k, i) => {
      const x = 47 + (i % 8) * 13.5 + 4.75;
      const hit = (pressL && Math.abs(x - lX) < 9) || (pressR && Math.abs(x - rX) < 9);
      k.setAttribute("fill", hit ? "#FF5100" : "#2D3BAB");
    });

    // painel: a linha atual cresce; ao completar, tudo sobe uma linha
    const L = TYPE_TOTAL / WIDTHS.length;
    const u = typedTime(t);
    const kLine = Math.floor(u / L), frac = u / L - kLine;
    const scroll = (1 - ease(clamp(frac * 5))) * ROW_H;
    for (let i = 0; i < rows.length; i++) {
      const idx = kLine - (rows.length - 1 - i);
      const w = WIDTHS[((idx % WIDTHS.length) + WIDTHS.length) % WIDTHS.length];
      const cur = i === rows.length - 1;
      const y = 60 - (rows.length - 1 - i) * ROW_H + scroll - 6;
      rows[i].setAttribute("y", y.toFixed(2));
      rows[i].setAttribute("width", (cur ? w * frac : w).toFixed(2));
      rows[i].setAttribute("fill-opacity", cur ? "1" : "0.5");
      if (cur) {
        cursor.setAttribute("x", (12 + w * frac).toFixed(2));
        cursor.setAttribute("y", (y - 1.25).toFixed(2));
        cursor.setAttribute("opacity", Math.sin(TAU * 2 * t) > -0.2 ? 1 : 0);
      }
    }
    $("holo").setAttribute("opacity", (0.72 + 0.28 * ty).toFixed(3));

    $("time").textContent = `${t.toFixed(2).replace(".", ",")} / 8,00 s`;
  }

  // ---------- QR: link inicial e troca ----------
  const start = params.get("qr") || $("qrUrl").value;
  $("qrUrl").value = start;
  function applyQR() {
    const v = $("qrUrl").value.trim();
    if (!v) { $("qrErr").textContent = "Cole um link para gerar o QR."; $("qrErr").hidden = false; return; }
    if (typeof qrcode !== "function") { $("qrErr").textContent = "O gerador de QR não carregou. Recarregue a página."; $("qrErr").hidden = false; return; }
    try { drawQR(v); $("qrErr").hidden = true; }
    catch (e) { $("qrErr").textContent = "Link longo demais para um QR legível no pin. Use um link encurtado."; $("qrErr").hidden = false; }
  }
  applyQR();
  $("apply").addEventListener("click", applyQR);
  $("qrUrl").addEventListener("keydown", (e) => { if (e.key === "Enter") applyQR(); });

  // ---------- reprodução ----------
  let playing = !matchMedia("(prefers-reduced-motion: reduce)").matches && !params.has("export");
  let offset = 0, t0 = performance.now();
  function frame() {
    if (!playing) return;
    render(offset + (performance.now() - t0) / 1000);
    requestAnimationFrame(frame);
  }
  $("pause").textContent = playing ? "Pausar" : "Tocar";
  $("pause").addEventListener("click", () => {
    if (playing) { offset += (performance.now() - t0) / 1000; playing = false; $("pause").textContent = "Tocar"; }
    else { t0 = performance.now(); playing = true; $("pause").textContent = "Pausar"; frame(); }
  });
  $("shape").addEventListener("click", () => {
    const sq = $("stage").classList.toggle("square");
    $("shape").setAttribute("aria-pressed", sq);
    $("shape").textContent = sq ? "Ver como pin" : "Ver quadrado";
  });
  render(0);
  frame();

  window.__pin = { T, render, ready: () => $("qr").childNodes.length > 0 };
})();
</script>

</body>
</html>
